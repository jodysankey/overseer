plugins {
    // Add support for Java
    id 'java'
    // Enable shadow for making a unified jar
    id 'com.gradleup.shadow' version '9.6.1'
}

// Declare where to find the dependencies
repositories {
    mavenCentral()
}

// Minimum Java version required to run the jar
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

// Declare the dependencies for production and test code
dependencies {
    // Compile time dependencies to include in the JAR
    implementation 'com.google.guava:guava:33.7.2-jre'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'  // Nullable annotation
    implementation 'org.glassfish:javax.json:1.1.4'

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.truth:truth:1.4.5'
    testImplementation 'org.mockito:mockito-core:5.24.0'
}

// Declare the jsankey-only JAR properties
jar {
    manifest {
        attributes 'Main-Class': 'com.jsankey.overseer.OverseerApplication'
    }
}

shadowJar {
    archiveBaseName = 'OverseerBundle'
    archiveClassifier = ''
    archiveVersion = ''
}
